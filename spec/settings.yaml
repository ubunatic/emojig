description: >-
  Interactive settings configuration options for the picker. Each option's
  `help` text is shown in the context-sensitive help modal (opened with
  ?/h/F1 on the selected settings row). Keep help lines short — the modal is
  rendered inside the picker window and long lines are truncated. Rows are
  rendered in option order; the Zig app resolves help by row index into this
  same options list, so order here is the single source of truth.
title: ⚙️ emojig settings
# Per-line budget for `help` (and help_fallback) text, in display characters.
# The help modal truncates lines to the grid content width (cols*4+1, minus
# 1 pane-padding column); 32 is the budget of the default 8-column grid.
# Asserted by scripts/test_tui/spec_lint_test.go — keep help lines short.
max_help_line_len: 32
help_fallback: |-
  Settings

  ↑↓ select  ←→ change
  ? help   Esc back
options:
    - id: shell_integration
      type: boolean
      label: shell integration
      default: "false"
      help: |-
        Shell integration

        Adds an `emojig` shell
        function. Enable, then
        `source` your shell rc.
    - id: shell_key_binding
      type: choice
      label: shell key binding
      choices:
        - C-o
        - C-e
        - C-x e
        - C-g
        - custom
      # Dropdown captions, index-aligned with choices (a missing tail entry
      # renders the bare choice).
      choice_help:
        - leaves C-e free
        - blocks end-line
        - blocks editor
        - blocks abort key
        - edit config
      default: C-o
      help: |-
        Shell key binding

        Choose a keybinding.
        Override by selecting 5
        or edit shell_key_binding
        in ~/.config/emojig/config
    - id: show_all_categories
      type: boolean
      label: show all categories
      default: "true"
      help: |-
        Show all categories

        on/off — list every
        category filter, or only
        matching/used ones.
    - id: ambiguous_chars
      type: choice
      label: ambiguous chars
      choices:
        - wide
        - narrow
      default: narrow
      help: |-
        Ambiguous chars

        wide | narrow
        Column width of chars
        like → ≈ ★.
    - id: theme
      type: choice
      label: theme
      choices:
        - dark
        - light
        - system
      default: dark
      help: |-
        Theme

        dark | light | system
        TUI follows terminal;
        GUI follows GNOME.
    - id: scrollbar_style
      type: choice
      label: scrollbar
      choices:
        - expand
        - bar
      default: expand
      help: |-
        Scrollbar

        expand | bar
        Proportional thumb, or
        a fixed single cell.
    - id: cols
      type: integer
      label: grid width (cols)
      default: "6"
      help: |-
        Grid width (cols)

        5–16 columns. Type a
        number or use ‹ ›.
        Applies on next launch.
    - id: rows
      type: integer
      label: grid height (rows)
      default: "4"
      help: |-
        Grid height (rows)

        3–16 rows. Type a
        number or use ‹ ›.
        Applies on next launch.
    - id: compact
      type: boolean
      label: compact grid
      default: "false"
      help: |-
        Compact grid

        on/off — 3-column cells
        instead of 4-columns.
        Applies on next launch.
    - id: app_bg
      type: choice
      label: app background
      choices:
        - default
        - deep
        - navy
        - slate
      default: default
      help: |-
        App background

        dark/light preset for
        the foot terminal bg.
        Applies on next launch.
    - id: title_bg
      type: choice
      label: title bar color
      choices:
        - raised
        - same
        - accent
        - dark
      default: raised
      help: |-
        Title bar color

        CSD title bar preset.
        (--decorated mode only)
        Applies on next launch.
    - id: decorated
      type: boolean
      label: decorated window
      default: "false"
      help: |-
        Decorated window

        Show title bar when
        launching --gui.
        Applies on next launch.
    - id: clear_mru
      type: action
      label: recent (MRU) history
      default: clear
      help: |-
        Clear MRU history

        Enter/Space clears the
        recently-used list.
        Cannot be undone.
